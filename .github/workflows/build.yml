name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" "platforms;android-35" > /dev/null

      # mksh is Android's shell, so the tests run the hooks the way the head unit does.
      - name: mksh
        run: sudo apt-get install -y mksh

      - uses: actions/cache@v4
        with:
          path: .cache
          key: sysimg-armeabi-v7a-19_r05-${{ hashFiles('build.sh') }}

      - name: Build
        run: ./build.sh

      - name: Test
        run: tests/run.sh

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -m1 '^version=' package/NEMESIS.data | cut -d= -f2)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != v${version} in NEMESIS.data"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: media.codecs
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: media.codecs
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
