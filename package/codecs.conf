# Software decoders this package can provide, one codec per line:
#   <library in lib/>  <OMX component name>  <mime type>  <test clip in clips/>
# A library is installed only when one of its codecs is needed and the unit's
# SoftOMXPlugin (libstagefright_omx.so) knows the component name.
libstagefright_soft_h264dec.so  OMX.google.h264.decoder   video/avc            avc.mp4
libstagefright_soft_mpeg4dec.so OMX.google.mpeg4.decoder  video/mp4v-es        mpeg4.mp4
libstagefright_soft_mpeg4dec.so OMX.google.h263.decoder   video/3gpp           h263.3gp
libstagefright_soft_vpxdec.so   OMX.google.vp8.decoder    video/x-vnd.on2.vp8  vp8.webm
libstagefright_soft_vpxdec.so   OMX.google.vp9.decoder    video/x-vnd.on2.vp9  vp9.webm
